[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
futures = "0.3"
postcard = { version = "1", features = ["alloc"] }
reedline = { version = "0.51", features = ["external_printer"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
